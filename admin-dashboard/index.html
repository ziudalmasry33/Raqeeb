<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رقيب | لوحة التحكم الإدارية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #071310;
      --card-bg: #0E221C;
      --emerald: #062E22;
      --gold: #D4AF37;
      --gold-hover: #E5C14B;
      --text-light: #F4F6F5;
      --text-muted: #9FB3AD;
      --border: rgba(212, 175, 55, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-light); min-height: 100vh; line-height: 1.6; }
    header {
      background: linear-gradient(135deg, var(--emerald), #0A3D2E);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 800; color: var(--gold); }
    .container { max-width: 960px; margin: 28px auto; padding: 0 16px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .card h2 { color: var(--gold); font-size: 1.15rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: #06100D;
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }
    button {
      background: var(--gold);
      color: var(--emerald);
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
    }
    button.secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
    button.danger { background: #B91C1C; color: #fff; width: auto; padding: 8px 14px; font-size: 0.85rem; }
    .hidden { display: none !important; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--gold); color: var(--emerald); padding: 10px 22px;
      border-radius: 99px; font-weight: bold; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 100;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🛡️ رقيب | لوحة الإدارة المركزية</div>
    <button id="logoutBtn" class="danger hidden" onclick="logoutAdmin()">تسجيل الخروج</button>
  </header>

  <div class="container">
    <section id="loginView" class="card" style="max-width: 460px; margin: 40px auto;">
      <h2>🔐 دخول المشرفين</h2>
      <input id="adminUser" type="text" placeholder="admin" value="admin" />
      <input id="adminPass" type="password" placeholder="••••••••••••" />
      <button onclick="handleAdminLogin()">دخول لوحة التحكم</button>
    </section>

    <div id="dashboardView" class="hidden">
      <section class="card">
        <h2>🔗 إعدادات الربط السحابي (Supabase)</h2>
        <div class="grid-2">
          <input id="sbUrl" type="text" placeholder="Project URL (https://xxxx.supabase.co)" />
          <input id="sbKey" type="text" placeholder="Anon Public Key (eyJhbGci...)" />
        </div>
        <button class="secondary" onclick="saveSupabaseConfig()">حفظ وتفعيل الاتصال السحابي</button>
      </section>

      <!-- إرسال رسالة فورية تظهر في التطبيق وإشعارات الهاتف -->
      <section class="card">
        <h2>📢 إرسال رسالة فورية للتطبيق (تصل كإشعار وبطاقة في الرئيسية)</h2>
        <input id="msgTitle" placeholder="عنوان الرسالة (مثال: تذكير من رقيب 🌿)" value="رسالة من إدارة رقيب 🌿" />
        <textarea id="msgBody" rows="3" placeholder="اكتب نص الرسالة التي ستصل لمستخدمي التطبيق فوراً..."></textarea>
        <button onclick="sendBroadcastMessage()">إرسال الرسالة الآن للتطبيق</button>
      </section>

      <!-- إضافة آية أو حديث -->
      <section class="card">
        <h2>📖 نشر آية قرآنية أو حديث شريف للتطبيق</h2>
        <select id="rType">
          <option value="quran">آية قرآنية كريمة</option>
          <option value="hadith">حديث نبوي صحيح</option>
          <option value="dua">دعاء مأثور لتهدئة النفس</option>
        </select>
        <textarea id="rTextAr" rows="2" placeholder="اكتب الآية أو الحديث بالعربية..."></textarea>
        <textarea id="rTextEn" rows="2" placeholder="English translation..."></textarea>
        <div class="grid-2">
          <input id="rSourceAr" placeholder="المصدر بالعربية" />
          <input id="rSourceEn" placeholder="Source in English" />
        </div>
        <button onclick="publishReminder()">نشر في الإشراقات الإيمانية</button>
      </section>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    let sb = null;
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "komando_admin_raqeeb@";

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3200);
    }

    function initSupabase() {
      const u = localStorage.getItem('sbUrl') || '';
      const k = localStorage.getItem('sbKey') || '';
      document.getElementById('sbUrl').value = u;
      document.getElementById('sbKey').value = k;
      if (u && k && window.supabase) {
        sb = window.supabase.createClient(u, k);
      }
    }

    function handleAdminLogin() {
      if (document.getElementById('adminUser').value.trim() === ADMIN_USER &&
          document.getElementById('adminPass').value === ADMIN_PASS) {
        sessionStorage.setItem('raqeeb_admin_auth', 'true');
        renderAuthState();
      } else {
        showToast("بيانات الدخول غير صحيحة!");
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('raqeeb_admin_auth');
      renderAuthState();
    }

    function renderAuthState() {
      const isAuth = sessionStorage.getItem('raqeeb_admin_auth') === 'true';
      document.getElementById('loginView').classList.toggle('hidden', isAuth);
      document.getElementById('dashboardView').classList.toggle('hidden', !isAuth);
      document.getElementById('logoutBtn').classList.toggle('hidden', !isAuth);
      if (isAuth) initSupabase();
    }

    function saveSupabaseConfig() {
      localStorage.setItem('sbUrl', document.getElementById('sbUrl').value.trim());
      localStorage.setItem('sbKey', document.getElementById('sbKey').value.trim());
      initSupabase();
      showToast("تم حفظ إعدادات الربط السحابي بنجاح ✅");
    }

    async function sendBroadcastMessage() {
      const title = document.getElementById('msgTitle').value.trim();
      const body = document.getElementById('msgBody').value.trim();
      if (!body) return showToast("اكتب نص الرسالة أولاً");
      if (!sb) return showToast("يرجى إدخال Project URL و Anon Key وحفظهما أولاً");

      const { error } = await sb.from('admin_messages').insert({
        title_ar: title || "رسالة من رقيب 🌿",
        body_ar: body
      });
      if (error) showToast("خطأ: " + error.message);
      else {
        document.getElementById('msgBody').value = "";
        showToast("تم إرسال الرسالة وستظهر في التطبيق فوراً ✅");
      }
    }

    async function publishReminder() {
      const textAr = document.getElementById('rTextAr').value.trim();
      if (!textAr) return showToast("يرجى كتابة النص أولاً");
      if (!sb) return showToast("يرجى حفظ إعدادات Supabase أولاً");
      const { error } = await sb.from('islamic_reminders').insert({
        content_type: document.getElementById('rType').value,
        text_ar: textAr,
        text_en: document.getElementById('rTextEn').value.trim(),
        source_ar: document.getElementById('rSourceAr').value.trim(),
        source_en: document.getElementById('rSourceEn').value.trim(),
        is_published: true
      });
      showToast(error ? "خطأ: " + error.message : "تم نشر التذكير في التطبيق ✅");
    }

    renderAuthState();
  </script>
</body>
</html>
