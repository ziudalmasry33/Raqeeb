<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رقيب | لوحة التحكم الإدارية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0A1210] text-[#F4F6F5] min-h-screen font-sans">
  <header class="bg-[#062E22] border-b border-[#D4AF37]/40 p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-[#D4AF37]">🛡️ رقيب | لوحة التحكم الإدارية</h1>
    <button id="logoutBtn" class="hidden bg-red-600/80 px-3 py-1 rounded text-sm">تسجيل الخروج</button>
  </header>

  <main class="max-w-4xl mx-auto p-6">
    <!-- إعداد الاتصال بـ Supabase -->
    <section id="configSection" class="bg-[#121E1B] border border-[#D4AF37]/30 rounded-xl p-6 mb-6">
      <h2 class="text-lg font-bold text-[#D4AF37] mb-3">1. ربط قاعدة بيانات Supabase المجانية</h2>
      <div class="grid gap-3">
        <input id="sbUrl" type="text" placeholder="Supabase Project URL (https://xxx.supabase.co)" class="p-3 rounded bg-[#0A1210] border border-gray-700 text-sm" />
        <input id="sbKey" type="text" placeholder="Supabase Anon Public Key" class="p-3 rounded bg-[#0A1210] border border-gray-700 text-sm" />
        <button onclick="saveConfig()" class="bg-[#D4AF37] text-[#062E22] font-bold py-2 rounded">حفظ الاتصال</button>
      </div>
    </section>

    <!-- تسجيل دخول المدير -->
    <section id="loginSection" class="bg-[#121E1B] border border-[#D4AF37]/30 rounded-xl p-6 mb-6">
      <h2 class="text-lg font-bold text-[#D4AF37] mb-3">2. دخول المشرفين (RBAC)</h2>
      <div class="grid gap-3">
        <input id="email" type="email" placeholder="البريد الإلكتروني للمدير" class="p-3 rounded bg-[#0A1210] border border-gray-700 text-sm" />
        <input id="password" type="password" placeholder="كلمة المرور" class="p-3 rounded bg-[#0A1210] border border-gray-700 text-sm" />
        <button onclick="loginAdmin()" class="bg-[#0D4A38] border border-[#D4AF37] text-white font-bold py-2 rounded">تسجيل الدخول</button>
      </div>
    </section>

    <!-- لوحة إدارة المحتوى -->
    <section id="adminPanel" class="hidden space-y-6">
      <div class="bg-[#121E1B] border border-[#D4AF37]/30 rounded-xl p-6">
        <h2 class="text-lg font-bold text-[#D4AF37] mb-4">إضافة تذكير إسلامي موثّق</h2>
        <div class="grid gap-3">
          <select id="rType" class="p-3 rounded bg-[#0A1210] border border-gray-700">
            <option value="quran">آية قرآنية</option>
            <option value="hadith">حديث شريف صحيح</option>
            <option value="dua">دعاء مأثور</option>
            <option value="reminder">تذكير إيماني</option>
          </select>
          <textarea id="rTextAr" placeholder="النص بالعربية" class="p-3 rounded bg-[#0A1210] border border-gray-700"></textarea>
          <textarea id="rTextEn" placeholder="Text in English" class="p-3 rounded bg-[#0A1210] border border-gray-700"></textarea>
          <input id="rSourceAr" placeholder="المصدر بالعربية (مثال: سورة النور - آية 30)" class="p-3 rounded bg-[#0A1210] border border-gray-700" />
          <input id="rSourceEn" placeholder="Source in English (e.g., Surah An-Nur 30)" class="p-3 rounded bg-[#0A1210] border border-gray-700" />
          <button onclick="publishReminder()" class="bg-[#D4AF37] text-[#062E22] font-bold py-2 rounded">نشر التذكير للتطبيق</button>
        </div>
      </div>

      <div class="bg-[#121E1B] border border-[#D4AF37]/30 rounded-xl p-6">
        <h2 class="text-lg font-bold text-[#D4AF37] mb-4">إضافة نطاق محظور جديد لقاعدة التصفية</h2>
        <div class="flex gap-2">
          <input id="dName" placeholder="example.com" class="flex-1 p-3 rounded bg-[#0A1210] border border-gray-700" />
          <select id="dCat" class="p-3 rounded bg-[#0A1210] border border-gray-700">
            <option value="ADULT">محتوى للبالغين</option>
            <option value="INAPPROPRIATE">محتوى غير لائق</option>
          </select>
          <button onclick="addBlockedDomain()" class="bg-[#D4AF37] text-[#062E22] font-bold px-4 rounded">إضافة</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    let sb = null;
    const savedUrl = localStorage.getItem('sbUrl') || '';
    const savedKey = localStorage.getItem('sbKey') || '';
    document.getElementById('sbUrl').value = savedUrl;
    document.getElementById('sbKey').value = savedKey;
    if (savedUrl && savedKey) sb = window.supabase.createClient(savedUrl, savedKey);

    function saveConfig() {
      const u = document.getElementById('sbUrl').value.trim();
      const k = document.getElementById('sbKey').value.trim();
      localStorage.setItem('sbUrl', u);
      localStorage.setItem('sbKey', k);
      sb = window.supabase.createClient(u, k);
      alert('تم حفظ إعدادات الاتصال بنجاح');
    }

    async function loginAdmin() {
      if (!sb) return alert('أدخل بيانات Supabase أولاً');
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      if (error) return alert('خطأ: ' + error.message);
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
    }

    async function publishReminder() {
      const { error } = await sb.from('islamic_reminders').insert({
        content_type: document.getElementById('rType').value,
        text_ar: document.getElementById('rTextAr').value,
        text_en: document.getElementById('rTextEn').value,
        source_ar: document.getElementById('rSourceAr').value,
        source_en: document.getElementById('rSourceEn').value,
        is_published: true
      });
      alert(error ? error.message : 'تم نشر التذكير بنجاح!');
    }

    async function addBlockedDomain() {
      const { error } = await sb.from('blocked_domains').insert({
        domain: document.getElementById('dName').value.trim().toLowerCase(),
        category: document.getElementById('dCat').value,
        is_active: true
      });
      alert(error ? error.message : 'تمت إضافة النطاق لقاعدة الحظر!');
    }
  </script>
</body>
</html>
